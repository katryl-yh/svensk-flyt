[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svensk-flyt-streamlit"
version = "0.1.0"
description = "Streamlit dashboard for Svensk Flyt data visualization"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.0.0",
    "duckdb>=0.8.0",
    "pandas>=1.0.0",
    "python-dotenv>=0.19.0",
]
